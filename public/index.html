<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easy transport</title>
  <style>
/* CSS BY CLAUDE */
*, *::before, *::after {
  box-sizing: border-box;
}

:root {
  color-scheme: light dark;   /* a böngésző saját elemei is követik a módot */

  --bg: #f4f5f9;
  --card: #ffffff;
  --text: #1f2430;
  --muted: #8a90a0;
  --border: #d9dce5;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --scroll-thumb: #c3c7d4;
  --scroll-thumb-hover: #a6abbc;
  --radius: 14px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161c;
    --card: #1e222b;
    --text: #e8eaf0;
    --muted: #7b8294;
    --border: #2f3441;
    --accent: #6366f1;
    --accent-hover: #818cf8;
    --scroll-thumb: #3b4151;
    --scroll-thumb-hover: #4d5568;
  }
}

html, body {
  margin: 0;
  height: 100%;
}

body {
  height: 100dvh;             /* mobilon a címsor miatt jobb, mint a 100vh */
  padding: 16px;
  display: grid;
  gap: 16px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* Telefon: függőleges elrendezés, szövegmező és p kb. fél-fél képernyő */
  grid-template-columns: 1fr;
  grid-template-rows: 1fr 1fr auto;
}

/* ---------- Űrlap ---------- */
form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

/* ---------- Szövegmező ---------- */
textarea {
  flex: 1;
  min-height: 0;
  padding: 16px;
  font: inherit;
  font-size: 16px;            /* 16px alatt az iOS ráközelít fókuszkor */
  line-height: 1.5;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  resize: none;
  overflow: auto;
  transition: border-color .15s, box-shadow .15s;
}

textarea::placeholder {
  color: var(--muted);
}

textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
}

/* ---------- Gombok ---------- */
button {
  padding: 14px 20px;
  font: inherit;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
  border: 0;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background .15s, transform .05s;
  -webkit-tap-highlight-color: transparent;
}

button:hover  { background: var(--accent-hover); }
button:active { transform: scale(.98); }

#copyBtn {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}

#copyBtn:hover {
  background: var(--accent);
  color: #fff;
}

/* ---------- Kimenet ---------- */
p {
  margin: 0;
  padding: 16px;
  min-height: 0;
  overflow: auto;
  line-height: 1.5;
  white-space: pre-wrap;      /* sortörések megmaradnak */
  overflow-wrap: anywhere;    /* hosszú szavak sem törik szét az elrendezést */
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

p:empty::before {
  color: var(--muted);
}

/* ---------- Szép görgősáv (textarea + p) ---------- */
textarea, p {
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) transparent;
}

textarea::-webkit-scrollbar,
p::-webkit-scrollbar {
  width: 10px;
}

textarea::-webkit-scrollbar-track,
p::-webkit-scrollbar-track {
  background: transparent;
}

textarea::-webkit-scrollbar-thumb,
p::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: 10px;
  border: 3px solid transparent;
  background-clip: padding-box;
}

textarea::-webkit-scrollbar-thumb:hover,
p::-webkit-scrollbar-thumb:hover {
  background: var(--scroll-thumb-hover);
  background-clip: padding-box;
}

/* ---------- Számítógép: vízszintes elrendezés ---------- */
@media (min-width: 768px) {
  body {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr auto;
    padding: 32px;
    gap: 20px;
  }

  form {
    grid-column: 1;
    grid-row: 1 / 3;          /* a bal oldal teljes magassága */
  }

  p {
    grid-column: 2;
    grid-row: 1;
  }

  #copyBtn {
    grid-column: 2;
    grid-row: 2;
  }
}
  </style>
</head>
<body>
  <form>
    <textarea id="textarea"></textarea>
    <button>Send</button>
  </form>
  <p></p>
  <button id="copyBtn">Copy</button>

  <script>
    const lastOctet = 104
    const API = `http://192.168.1.${lastOctet}:9001/data`
    console.log(API)

    async function getData () {
      try {
        const response = await fetch(API)
        if (!response.ok) {
          throw new Error(`HTTP hiba: ${response.status}`)
        }

        const result = await response.json()
        document.querySelector('p').textContent = result.data ?? ''
      } catch (error) {
        console.error('GET error:', error)
      }
    }

    
    document.querySelector('button').onclick = async function () {
      const data = document.getElementById('textarea').value
      
      try {
        const response = await fetch(API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({data})
        })
        
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`)
        }
        
        await getData()
      } catch (error) {
        console.error('POST error:', error)
      }
    }
    
    getData()


const copyBtn = document.getElementById('copyBtn');
copyBtn.onclick = async function () {
  const data = document.querySelector('p').textContent;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(data);
    } else {
      const textarea = document.createElement('textarea');
      textarea.value = data;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      const success = document.execCommand('copy');
      textarea.remove();

      if (!success) throw new Error('Copy failed');
    }

    copyBtn.textContent = 'Copied!';

    setTimeout(() => {
      copyBtn.textContent = 'Copy';
    }, 1500);

  } catch (error) {
    console.error("Copy didn't work:", error);
  }
};


  </script>
</body>
</html>
